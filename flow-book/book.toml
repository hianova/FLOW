[book]
authors = ["FLOW Authors & Architectural Audit Team"]
language = "zh-TW"
multilingual = false
src = "src"
title = "The FLOW Book: 意圖驅動的活體系統"
description = "從靜態編譯到動態活體拓樸系統的典範轉移：1-Bit 混沌退火、QSBR 無鎖熱替換、SMT 形式化驗證與 Level-5 自我意識架構全景審計"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/hianova/FLOW"
edit-url-template = "https://github.com/hianova/FLOW/edit/main/{path}"
mathjax-support = true
default-theme = "navy"
preferred-dark-theme = "navy"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
max-snippet-length = 140
search-mode = "stemming"
