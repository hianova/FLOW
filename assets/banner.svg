<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="100%" height="100%">
  <defs>
    <style>
      .glass-base { fill: #ffffff; fill-opacity: 0.14; stroke: #a3a3a3; stroke-opacity: 0.34; }
      .glass-rim  { fill: none; stroke: #ffffff; stroke-opacity: 0.28; }
      .divider    { stroke: #a3a3a3; stroke-opacity: 0.28; }
      .wave-1     { stroke: #242424; stroke-opacity: 0.90; }
      .wave-2     { stroke: #525252; stroke-opacity: 0.65; }
      .wave-3     { stroke: #737373; stroke-opacity: 0.42; }
      .title      { fill: #141414; }
      .subtitle   { fill: #525252; }
      .meta       { fill: #737373; }
      @media (prefers-color-scheme: dark) {
        .glass-base { fill: #ffffff; fill-opacity: 0.06; stroke: #d4d4d4; stroke-opacity: 0.22; }
        .glass-rim  { stroke: #ffffff; stroke-opacity: 0.14; }
        .divider    { stroke: #d4d4d4; stroke-opacity: 0.18; }
        .wave-1     { stroke: #fafafa; stroke-opacity: 0.92; }
        .wave-2     { stroke: #d4d4d4; stroke-opacity: 0.66; }
        .wave-3     { stroke: #a3a3a3; stroke-opacity: 0.42; }
        .title      { fill: #fafafa; }
        .subtitle   { fill: #d4d4d4; }
        .meta       { fill: #a3a3a3; }
      }
    </style>

    <linearGradient id="banner-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#a3a3a3" stop-opacity="0.10" />
    </linearGradient>

    <filter id="banner-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.80" numOctaves="2" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="mono" />
      <feComponentTransfer in="mono" result="grain">
        <feFuncA type="linear" slope="0.04" />
      </feComponentTransfer>
      <feGaussianBlur in="grain" stdDeviation="0.35" />
    </filter>

    <clipPath id="banner-clip">
      <rect x="8" y="8" width="904" height="224" rx="22" />
    </clipPath>
  </defs>

  <!-- Colorless Semi-Transparent Frosted Glass Surface -->
  <rect x="8" y="8" width="904" height="224" rx="22" class="glass-base" stroke-width="1.25" />
  <rect x="8" y="8" width="904" height="224" rx="22" fill="url(#banner-sheen)" />
  <rect x="8" y="8" width="904" height="224" clip-path="url(#banner-clip)" filter="url(#banner-grain)" />
  <rect x="9.25" y="9.25" width="901.5" height="221.5" rx="20.75" class="glass-rim" stroke-width="1" />

  <!-- Minimalist 3-Line Wave Mark -->
  <g fill="none" stroke-linecap="round">
    <path class="wave-1" stroke-width="7.5"
          d="M 64 92 C 102 62, 138 122, 182 92 C 210 72, 232 86, 250 78" />
    <path class="wave-2" stroke-width="6"
          d="M 64 122 C 102 92, 138 152, 182 122 C 210 102, 232 116, 250 108" />
    <path class="wave-3" stroke-width="4.5"
          d="M 64 152 C 102 122, 138 182, 182 152 C 210 132, 232 146, 250 138" />
  </g>

  <!-- Hairline Divider -->
  <line x1="296" y1="54" x2="296" y2="186" class="divider" stroke-width="1" />

  <!-- Clean Normalized Typography -->
  <g transform="translate(336, 0)">
    <text x="0" y="106"
          class="title"
          font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', sans-serif"
          font-size="54"
          font-weight="800"
          letter-spacing="5">FLOW</text>

    <text x="2" y="140"
          class="subtitle"
          font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Segoe UI', sans-serif"
          font-size="13.5"
          font-weight="600"
          letter-spacing="2.2">FORMALLY VERIFIED L0 INTEGER, HOTT &amp; 2-JET SUBSTRATE</text>

    <text x="2" y="172"
          class="meta"
          font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace"
          font-size="12"
          letter-spacing="0.4">Lean 4 SSOT (0 sorryAx)  •  Zero Float  •  Zero Heap  •  Freestanding Ring-0 &amp; Lock-Free QSBR</text>
  </g>
</svg>
