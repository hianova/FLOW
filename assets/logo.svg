<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .glass-base { fill: #ffffff; fill-opacity: 0.14; stroke: #a3a3a3; stroke-opacity: 0.34; }
      .glass-rim  { fill: none; stroke: #ffffff; stroke-opacity: 0.28; }
      .wave-1     { stroke: #383838; stroke-opacity: 0.90; }
      .wave-2     { stroke: #525252; stroke-opacity: 0.68; }
      .wave-3     { stroke: #737373; stroke-opacity: 0.46; }
      @media (prefers-color-scheme: dark) {
        .glass-base { fill: #ffffff; fill-opacity: 0.06; stroke: #d4d4d4; stroke-opacity: 0.22; }
        .glass-rim  { stroke: #ffffff; stroke-opacity: 0.14; }
        .wave-1     { stroke: #f2f2f2; stroke-opacity: 0.92; }
        .wave-2     { stroke: #d4d4d4; stroke-opacity: 0.68; }
        .wave-3     { stroke: #a3a3a3; stroke-opacity: 0.44; }
      }
    </style>

    <linearGradient id="frosted-sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#a3a3a3" stop-opacity="0.10" />
    </linearGradient>

    <filter id="frosted-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.80" numOctaves="2" stitchTiles="stitch" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="mono" />
      <feComponentTransfer in="mono" result="grain">
        <feFuncA type="linear" slope="0.045" />
      </feComponentTransfer>
      <feGaussianBlur in="grain" stdDeviation="0.35" />
    </filter>

    <clipPath id="logo-clip">
      <rect x="24" y="24" width="464" height="464" rx="96" />
    </clipPath>
  </defs>

  <!-- Colorless Semi-Transparent Frosted Glass Card -->
  <rect x="24" y="24" width="464" height="464" rx="96" class="glass-base" stroke-width="1.5" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#frosted-sheen)" />
  <rect x="24" y="24" width="464" height="464" clip-path="url(#logo-clip)" filter="url(#frosted-grain)" />
  <rect x="25.5" y="25.5" width="461" height="461" rx="94.5" class="glass-rim" stroke-width="1" />

  <!-- Minimalist Harmonic Wave Lines -->
  <g fill="none" stroke-linecap="round">
    <path class="wave-1" stroke-width="14"
          d="M 104 204 C 168 148, 224 260, 296 204 C 344 166, 378 190, 408 178" />
    <path class="wave-2" stroke-width="11"
          d="M 104 258 C 168 202, 224 314, 296 258 C 344 220, 378 244, 408 232" />
    <path class="wave-3" stroke-width="8"
          d="M 104 312 C 168 256, 224 368, 296 312 C 344 274, 378 298, 408 286" />
  </g>
</svg>
